name: Fetch TDLib SDK and Binaries

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Output Folders
        run: |
          mkdir -p jniLibs/arm64-v8a
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: Download Official Files
        run: |
          set -e

          echo "1. Downloading Official Client.java..."
          curl -f -sL "https://raw.githubusercontent.com/tdlib/td/master/example/android/src/org/drinkless/td/libcore/telegram/Client.java" \
               -o java/org/drinkless/td/libcore/telegram/Client.java

          echo "2. Downloading Official TdApi.java..."
          curl -f -sL "https://raw.githubusercontent.com/tdlib/td/master/example/java/org/drinkless/tdlib/TdApi.java" \
               -o java/org/drinkless/td/libcore/telegram/TdApi.java || \
          curl -f -sL "https://raw.githubusercontent.com/telegram-sms/telegram-sms-android/master/app/src/main/java/org/drinkless/td/libcore/telegram/TdApi.java" \
               -o java/org/drinkless/td/libcore/telegram/TdApi.java

          echo "3. Downloading Prebuilt arm64-v8a libtdjni.so..."
          # प्रमाणित स्रोत से 64-bit Android बाइनरी डाउनलोड (Fail fast flag -f enabled)
          curl -f -sL "https://raw.githubusercontent.com/telegram-sms/telegram-sms-android/master/app/libs/arm64-v8a/libtdjni.so" \
               -o jniLibs/arm64-v8a/libtdjni.so || \
          curl -f -sL "https://github.com/TGX-Android/Telegram-Extra/raw/master/TMessagesProj/jni/arm64-v8a/libtdjni.so" \
               -o jniLibs/arm64-v8a/libtdjni.so

          echo "4. Validating downloaded files..."
          SO_SIZE=$(stat -c%s "jniLibs/arm64-v8a/libtdjni.so" 2>/dev/null || echo 0)
          echo "libtdjni.so size: $SO_SIZE bytes"

          # बाइनरी का साइज कम से कम 5MB होना चाहिए
          if [ "$SO_SIZE" -lt 5000000 ]; then
              echo "❌ Error: libtdjni.so is invalid or incomplete."
              exit 1
          fi

          echo "✅ All files downloaded and verified successfully!"
          ls -lh jniLibs/arm64-v8a/
          ls -lh java/org/drinkless/td/libcore/telegram/

      - name: Commit Files to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jniLibs/
          git add java/
          git commit -m "Add TDLib native binary and Java classes" || echo "No changes to commit"
          git push
