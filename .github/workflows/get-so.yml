name: Setup Official TDLib SDK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Official Java SDK and Native Libs
        run: |
          # 1. Create matching Directory Structure
          mkdir -p app/src/main/java/org/drinkless/td/libcore/telegram
          mkdir -p app/src/main/jniLibs/arm64-v8a

          # 2. Download Official Java Wrappers (Client.java & TdApi.java)
          curl -sL "https://raw.githubusercontent.com/tdlib/td/master/example/android/src/org/drinkless/td/libcore/telegram/Client.java" \
               -o app/src/main/java/org/drinkless/td/libcore/telegram/Client.java

          # Download TDLib Native ARM64 binary
          curl -sL "https://github.com/Sobesednik/tdlib-binaries/raw/master/1.8.0/arm64-v8a/libtdjni.so" \
               -o app/src/main/jniLibs/arm64-v8a/libtdjni.so

          # Download matching official TdApi definitions
          curl -sL "https://github.com/Sobesednik/tdlib-binaries/raw/master/1.8.0/TdApi.java" \
               -o app/src/main/java/org/drinkless/td/libcore/telegram/TdApi.java

          # 3. Verify Files
          echo "=== Verification ==="
          ls -lh app/src/main/java/org/drinkless/td/libcore/telegram/
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Commit Official TDLib to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/org/drinkless/td/libcore/telegram/
          git add app/src/main/jniLibs/arm64-v8a/
          git commit -m "Add official TDLib Java SDK and ARM64 binary" || echo "No changes to commit"
          git push
