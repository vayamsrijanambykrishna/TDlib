name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Target Directory
        run: |
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: Generate Official TdApi.java (Takes ~30 seconds)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli ninja-build

          # 1. Clone TDLib
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td
          mkdir build && cd build

          # 2. Build generator executable
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=ON -GNinja ..
          ninja td_generate_java_api

          # 3. Execute generator to produce TdApi.java
          ./td/generate/td_generate_java_api || (cd .. && ./build/td/generate/td_generate_java_api)

          # 4. Copy generated file to destination
          find $GITHUB_WORKSPACE/td -name "TdApi.java" -exec cp {} $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java \;

          # 5. Ensure package name matches Client.java
          sed -i 's/package org.drinkless.tdlib;/package org.drinkless.td.libcore.telegram;/' $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Verify Generated Files
        run: |
          echo "=== Verification ==="
          ls -lh java/org/drinkless/td/libcore/telegram/
          head -n 5 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git commit -m "Add generated official TdApi.java" || echo "No changes"
          git push
