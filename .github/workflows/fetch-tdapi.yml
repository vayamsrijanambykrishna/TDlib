name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Target Directory
        run: |
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: Generate Official TdApi.java via Ninja Target (~15 seconds)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli ninja-build

          # 1. Clone TDLib
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td
          mkdir build && cd build

          # 2. Configure root TDLib with JNI
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=ON -GNinja ..

          # 3. Ninja से सीधे TdApi.java टारगेट को कॉल करें
          TARGET=$(ninja -t targets all | grep -i "TdApi\.java" | cut -d':' -f1 | head -n 1)
          echo "Discovered Ninja Target: $TARGET"

          if [ -n "$TARGET" ]; then
              ninja "$TARGET"
          else
              ninja prepare_cross_compiling
          fi

          # 4. Copy generated file to destination
          cd $GITHUB_WORKSPACE
          TDAPI_FILE=$(find td -name "TdApi.java" | head -n 1)
          echo "Generated TdApi found at: $TDAPI_FILE"

          cp "$TDAPI_FILE" java/org/drinkless/td/libcore/telegram/TdApi.java
          cp "$TDAPI_FILE" TdApi.java

          # 5. Fix package name to match Client.java
          sed -i 's/^package .*/package org.drinkless.td.libcore.telegram;/' java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Verify TdApi.java
        run: |
          echo "=== File Verification ==="
          ls -lh java/org/drinkless/td/libcore/telegram/
          ls -lh TdApi.java
          
          if [ ! -f "java/org/drinkless/td/libcore/telegram/TdApi.java" ]; then
              echo "Error: TdApi.java missing!"
              exit 1
          fi
          
          head -n 10 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git add TdApi.java
          git commit -m "Add official generated TdApi.java" || echo "No changes"
          git push
