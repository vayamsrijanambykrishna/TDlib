name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Target Directory
        run: |
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: Generate Official TdApi.java (~25 seconds)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli ninja-build

          # 1. Clone TDLib source
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td
          mkdir build && cd build

          # 2. Build generator tool (takes ~10s)
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=ON -GNinja ..
          ninja td_generate_java_api

          # 3. Create required output directories for C++ ofstream
          cd $GITHUB_WORKSPACE/td/td/generate
          mkdir -p auto/tlo/org/drinkless/tdlib
          mkdir -p auto/org/drinkless/tdlib
          mkdir -p auto/td/telegram

          # 4. Execute generator binary
          $GITHUB_WORKSPACE/td/build/td/generate/td_generate_java_api

          # 5. Copy generated TdApi.java to destination
          cd $GITHUB_WORKSPACE
          find td -name "TdApi.java" -exec cp {} java/org/drinkless/td/libcore/telegram/TdApi.java \;

          # 6. Set correct package name to match Client.java
          sed -i 's/^package .*/package org.drinkless.td.libcore.telegram;/' java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Verify TdApi.java File
        run: |
          echo "=== Verification ==="
          ls -lh java/org/drinkless/td/libcore/telegram/
          
          FILE_SIZE=$(stat -c%s "java/org/drinkless/td/libcore/telegram/TdApi.java" 2>/dev/null || echo 0)
          echo "TdApi.java size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
              echo "Error: TdApi.java generation failed or incomplete!"
              exit 1
          fi
          
          head -n 10 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git commit -m "Add official generated TdApi.java" || echo "No changes"
          git push
