name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Snatch TdApi.java from Official Build (~20 seconds)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli
          
          # 1. Clone Official TDLib
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td/example/java
          mkdir build && cd build
          
          # 2. Configure Official Java Example
          cmake -DCMAKE_BUILD_TYPE=Release ..
          
          # 3. Start Official Build in Background
          echo "Starting official build process in background..."
          make -j2 &
          BUILD_PID=$!
          
          # 4. Monitor and Snatch the File!
          echo "Monitoring for TdApi.java generation..."
          mkdir -p java/org/drinkless/tdlib
          
          SUCCESS=0
          for i in {1..60}; do
              if [ -f "java/org/drinkless/tdlib/TdApi.java" ]; then
                  SIZE=$(stat -c%s "java/org/drinkless/tdlib/TdApi.java" 2>/dev/null || echo 0)
                  if [ "$SIZE" -gt 500000 ]; then
                      echo "✅ TdApi.java successfully generated! Size: $SIZE bytes"
                      SUCCESS=1
                      break
                  fi
              fi
              sleep 2
          done
          
          # 5. Kill the compiler so we don't waste 40 minutes!
          echo "Stopping the C++ compiler..."
          kill -9 $BUILD_PID || true
          
          if [ "$SUCCESS" -eq 0 ]; then
              echo "❌ Error: TdApi.java was not generated."
              exit 1
          fi
          
          # 6. Copy to your app's directory
          TARGET_DIR="$GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram"
          mkdir -p "$TARGET_DIR"
          cp java/org/drinkless/tdlib/TdApi.java "$TARGET_DIR/TdApi.java"
          
          # 7. Match the package name
          sed -i 's/^package .*/package org.drinkless.td.libcore.telegram;/' "$TARGET_DIR/TdApi.java"

      - name: Verify Stolen File
        run: |
          echo "=== Final Verification ==="
          ls -lh java/org/drinkless/td/libcore/telegram/
          
          FILE_SIZE=$(stat -c%s "java/org/drinkless/td/libcore/telegram/TdApi.java" 2>/dev/null || echo 0)
          echo "TdApi.java Size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 500000 ]; then
              echo "❌ Final check failed!"
              exit 1
          fi
          
          head -n 5 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git commit -m "Add official TdApi.java (Snatched successfully)" || echo "No changes"
          git push
