name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Target Directory
        run: |
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: Direct Download Pre-generated TdApi.java (~3 seconds)
        run: |
          # आधिकारिक प्री-जेनरेटेड TdApi.java को सीधे डाउनलोड करें
          curl -f -sL "https://raw.githubusercontent.com/DrKLO/Telegram/master/TMessagesProj/src/main/java/org/drinkless/td/libcore/telegram/TdApi.java" \
               -o java/org/drinkless/td/libcore/telegram/TdApi.java || \
          curl -f -sL "https://raw.githubusercontent.com/grishka/Near/master/app/src/main/java/org/drinkless/td/libcore/telegram/TdApi.java" \
               -o java/org/drinkless/td/libcore/telegram/TdApi.java

          # पैकेज नाम सुनिश्चित करें
          sed -i 's/^package .*/package org.drinkless.td.libcore.telegram;/' java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Verify Downloaded File
        run: |
          echo "=== File Details ==="
          ls -lh java/org/drinkless/td/libcore/telegram/TdApi.java
          
          FILE_SIZE=$(stat -c%s "java/org/drinkless/td/libcore/telegram/TdApi.java" 2>/dev/null || echo 0)
          echo "File size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 500000 ]; then
              echo "Error: Download failed or file too small!"
              exit 1
          fi

          head -n 10 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git commit -m "Add pre-generated official TdApi.java" || echo "No changes"
          git push
