name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Target Directory
        run: |
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: Official TdApi Generation via Ninja (Takes ~10 seconds)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli ninja-build

          # 1. Clone TDLib
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td
          mkdir build && cd build

          # 2. Configure TDLib with JNI support
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=ON -GNinja ..

          # 3. Discover exact TdApi.java Ninja build target
          ninja -t targets > targets.txt
          TARGET=$(grep -i "TdApi\.java" targets.txt | cut -d':' -f1 | head -n 1 | xargs)
          echo "Discovered Target: '$TARGET'"

          # 4. Build only the Java API target
          if [ -n "$TARGET" ]; then
              ninja -v "$TARGET"
          else
              ninja td_generate_java_api
              ninja tdjni || true
          fi

          # 5. Copy generated TdApi.java to destination
          cd $GITHUB_WORKSPACE
          TDAPI_PATH=$(find td -name "TdApi.java" | head -n 1)
          echo "Generated TdApi found at: $TDAPI_PATH"

          cp "$TDAPI_PATH" java/org/drinkless/td/libcore/telegram/TdApi.java
          cp "$TDAPI_PATH" TdApi.java

          # 6. Set package to match Client.java
          sed -i 's/^package .*/package org.drinkless.td.libcore.telegram;/' java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Verify Generated TdApi.java
        run: |
          echo "=== File Verification ==="
          ls -lh java/org/drinkless/td/libcore/telegram/
          ls -lh TdApi.java
          
          FILE_SIZE=$(stat -c%s "java/org/drinkless/td/libcore/telegram/TdApi.java" 2>/dev/null || echo 0)
          echo "TdApi.java Size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 500000 ]; then
              echo "Error: TdApi.java was not generated properly!"
              exit 1
          fi
          
          head -n 5 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git add TdApi.java
          git commit -m "Add official generated TdApi.java" || echo "No changes"
          git push
