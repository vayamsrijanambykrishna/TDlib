name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Target Directory
        run: |
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: Generate Official TdApi.java
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli ninja-build

          # 1. Clone TDLib
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td
          mkdir build && cd build

          # 2. Build Generator
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=ON -GNinja ..
          ninja td_generate_java_api
          cd ..

          # 3. Execute generator from root directory (where TL scheme files exist)
          ./build/td/generate/td_generate_java_api || true

          # 4. Find generated TdApi.java and copy
          TDAPI_PATH=$(find . -name "TdApi.java" | head -n 1)
          if [ -n "$TDAPI_PATH" ]; then
              cp "$TDAPI_PATH" $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java
          fi

          # 5. Fallback in case generation path varied
          if [ ! -f "$GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java" ]; then
              echo "Using official source fallback..."
              curl -sL "https://repo1.maven.org/maven2/org/drinkless/tdlib/1.8.0/tdlib-1.8.0-sources.jar" -o sources.jar || true
              if [ -f "sources.jar" ]; then
                  unzip -o sources.jar "org/drinkless/td/libcore/telegram/TdApi.java" -d $GITHUB_WORKSPACE/java/ || \
                  unzip -o sources.jar "org/drinkless/tdlib/TdApi.java" -d $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/
              fi
          fi

          # 6. Normalize package name to match Client.java
          sed -i 's/^package .*/package org.drinkless.td.libcore.telegram;/' $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Verify Generated TdApi.java
        run: |
          echo "=== Verification ==="
          ls -lh java/org/drinkless/td/libcore/telegram/
          head -n 5 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git commit -m "Add official generated TdApi.java" || echo "No changes"
          git push
