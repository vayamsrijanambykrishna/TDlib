name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Target Directory
        run: |
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: Generate Official TdApi.java (~20 seconds)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli ninja-build

          # 1. Clone TDLib source
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td
          mkdir build && cd build

          # 2. Build generator tool (takes ~10s)
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=ON -GNinja ..
          ninja td_generate_java_api

          # 3. Locate generator binary and tl scheme
          GEN_BIN=$(find $GITHUB_WORKSPACE/td/build -name "td_generate_java_api" -type f | head -n 1)
          TL_SRC=$(find $GITHUB_WORKSPACE/td -name "td_api.tl" | head -n 1)

          # 4. Prepare dedicated generation workspace
          mkdir -p $GITHUB_WORKSPACE/gen_work/scheme
          mkdir -p $GITHUB_WORKSPACE/gen_work/auto/tlo/org/drinkless/tdlib
          mkdir -p $GITHUB_WORKSPACE/gen_work/auto/org/drinkless/tdlib
          mkdir -p $GITHUB_WORKSPACE/gen_work/auto/td/telegram

          cp "$TL_SRC" $GITHUB_WORKSPACE/gen_work/scheme/td_api.tl

          # 5. Execute generator from dedicated workspace
          cd $GITHUB_WORKSPACE/gen_work
          "$GEN_BIN"

          # 6. Copy generated file to repository folder
          cd $GITHUB_WORKSPACE
          TDAPI_PATH=$(find $GITHUB_WORKSPACE -name "TdApi.java" | head -n 1)
          echo "Generated TdApi found at: $TDAPI_PATH"
          cp "$TDAPI_PATH" java/org/drinkless/td/libcore/telegram/TdApi.java

          # 7. Normalize package name to match Client.java
          sed -i 's/^package .*/package org.drinkless.td.libcore.telegram;/' java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Verify TdApi.java File
        run: |
          echo "=== File Verification ==="
          ls -lh java/org/drinkless/td/libcore/telegram/
          
          FILE_SIZE=$(stat -c%s "java/org/drinkless/td/libcore/telegram/TdApi.java" 2>/dev/null || echo 0)
          echo "TdApi.java Size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 500000 ]; then
              echo "Error: TdApi.java was not generated properly!"
              exit 1
          fi
          
          head -n 10 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git commit -m "Add official generated TdApi.java" || echo "No changes"
          git push
