name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Target Directory
        run: |
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: Generate Official TdApi.java (Takes 15s)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli ninja-build

          # 1. Clone TDLib source
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td
          mkdir build && cd build

          # 2. Build generator tool (10 seconds)
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=ON -GNinja ..
          ninja td_generate_java_api

          # 3. Create required generator output directories
          cd $GITHUB_WORKSPACE/td/td/generate
          mkdir -p auto/tlo/org/drinkless/tdlib
          mkdir -p auto/tlo/org/drinkless/td/libcore/telegram

          # 4. Execute generator inside its native working directory
          $GITHUB_WORKSPACE/td/build/td/generate/td_generate_java_api

          # 5. Locate generated TdApi.java and copy to repo
          GENERATED_FILE=$(find $GITHUB_WORKSPACE/td -name "TdApi.java" | head -n 1)
          echo "Generated file found at: $GENERATED_FILE"

          cp "$GENERATED_FILE" $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java

          # 6. Set package to match Client.java
          sed -i 's/^package .*/package org.drinkless.td.libcore.telegram;/' $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Verify Generated File
        run: |
          echo "=== Verification Summary ==="
          ls -lh java/org/drinkless/td/libcore/telegram/
          
          FILE_SIZE=$(stat -c%s "java/org/drinkless/td/libcore/telegram/TdApi.java" 2>/dev/null || echo 0)
          echo "TdApi.java Size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 500000 ]; then
              echo "Error: TdApi.java file missing or empty!"
              exit 1
          fi
          
          head -n 5 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git commit -m "Add official generated TdApi.java model" || echo "No changes"
          git push
