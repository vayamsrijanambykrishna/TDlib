name: Fetch and Add TdApi.java

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-tdapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Target Directory
        run: |
          mkdir -p java/org/drinkless/td/libcore/telegram

      - name: The Ultimate TdApi.java Generator (15 seconds)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli ninja-build

          git clone --depth 1 https://github.com/tdlib/td.git
          cd td
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_JNI=ON -GNinja ..

          # Attempt 1: Use the exact target Ninja suggested!
          echo "Attempt 1: Using ninja tdapi..."
          ninja tdapi || true

          TDAPI_FILE=$(find $GITHUB_WORKSPACE/td -name "TdApi.java" | head -n 1)

          # Attempt 2: Manually execute generator with strict CLI arguments
          if [ -z "$TDAPI_FILE" ]; then
              echo "Attempt 2: Compiling generator and forcing exact file paths..."
              ninja td_generate_java_api || true
              GEN_BIN=$(find $GITHUB_WORKSPACE/td/build -name "td_generate_java_api" -type f -executable | head -n 1)
              TL_FILE=$(find $GITHUB_WORKSPACE/td -name "td_api.tl" -type f | head -n 1)
              OUT_FILE="$GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java"
              
              # td_generate_java_api <td_api.tl_path> <Output_java_path> <package_name>
              "$GEN_BIN" "$TL_FILE" "$OUT_FILE" "org.drinkless.td.libcore.telegram" || \
              "$GEN_BIN" "$TL_FILE" "$OUT_FILE" || true
              
              TDAPI_FILE="$OUT_FILE"
          fi

          # Attempt 3: Download from a verified TDLib Java Wrapper mirror
          if [ ! -f "$TDAPI_FILE" ] || [ ! -s "$TDAPI_FILE" ]; then
              echo "Attempt 3: Downloading from reliable mirror..."
              curl -sL "https://raw.githubusercontent.com/Kylmakalle/tdlib-java/master/src/main/java/org/drinkless/tdlib/TdApi.java" -o $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java
              TDAPI_FILE="$GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java"
          else
              cp "$TDAPI_FILE" $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java || true
          fi

          # Final Guarantee: Fix the package name to match your Android Client.java
          sed -i 's/^package .*/package org.drinkless.td.libcore.telegram;/' $GITHUB_WORKSPACE/java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Verify TdApi.java File
        run: |
          echo "=== Verification ==="
          ls -lh java/org/drinkless/td/libcore/telegram/
          
          FILE_SIZE=$(stat -c%s "java/org/drinkless/td/libcore/telegram/TdApi.java" 2>/dev/null || echo 0)
          echo "TdApi.java Size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 100000 ]; then
              echo "Error: TdApi.java is missing or too small!"
              exit 1
          fi
          
          head -n 5 java/org/drinkless/td/libcore/telegram/TdApi.java

      - name: Commit TdApi.java to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add java/org/drinkless/td/libcore/telegram/TdApi.java
          git commit -m "Add foolproof TdApi.java" || echo "No changes"
          git push
